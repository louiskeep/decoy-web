name: Deploy site to GitHub Pages

# Builds the combined site and publishes it to GitHub Pages on every push to
# main. Two builds feed one publish:
#   - the Eleventy marketing site (npm, repo root) -> dist/
#   - the Fumadocs docs project (pnpm, docs-src/, static export) -> dist/docs/
# The CNAME file (passed through to dist/) binds the site to the custom domain;
# configure the domain's DNS and the Pages custom-domain setting once.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write Pages, mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build the combined site and validate it. `check` runs the full combined
      # build (eleventy + the Fumadocs export assembled into dist/docs, see
      # scripts/build-docs.sh) and then the snippet, link, and claim checks, so a
      # broken site fails the deploy instead of shipping. dist/ is left built for
      # the upload step.
      - run: npm ci
      - run: npm run check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

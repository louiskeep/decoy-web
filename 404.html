<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Page not found &middot; Decoy</title>
	<meta name="robots" content="noindex">
	<script data-cfasync="false">
	(function(){
		function dark(){document.documentElement.classList.add("darkmode");document.documentElement.style.backgroundColor='#0d0d0d';document.documentElement.style.colorScheme='dark';}
		try{var p=localStorage.getItem("mode");if(p!==null){if(p==='dark')dark();return;}}catch(e){}
		if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)dark();
	})();
	</script>
	<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
	<link rel="shortcut icon" href="/images/decoy/favicon.ico">
	<style>
		@font-face{font-family:'Space Grotesk';src:url('/fonts/space-grotesk-700.woff2') format('woff2');font-weight:700;font-display:swap;}
		@font-face{font-family:'Inter';src:url('/fonts/inter-400.woff2') format('woff2');font-weight:400;font-display:swap;}
		@font-face{font-family:'Inter';src:url('/fonts/inter-500.woff2') format('woff2');font-weight:500;font-display:swap;}
		:root{--bg:#ffffff;--ink:#1a1a1a;--muted:#5b5b5b;--teal:#00867e;--line:#e6e6e6;}
		html.darkmode{--bg:#0d0d0d;--ink:#f2f2f2;--muted:#9aa0a6;--teal:#2bb3a9;--line:#262626;}
		*{box-sizing:border-box;}
		body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
			background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:24px;}
		.card{max-width:560px;text-align:center;}
		.mark{width:64px;height:64px;object-fit:contain;margin:0 auto 28px;display:block;}
		.code{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:72px;line-height:1;
			letter-spacing:-.02em;margin:0 0 10px;}
		.code span{color:var(--teal);}
		h1{font-family:'Space Grotesk','Inter',sans-serif;font-weight:700;font-size:26px;margin:0 0 12px;}
		p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 28px;}
		.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
		a.btn{display:inline-block;padding:11px 20px;border-radius:6px;font-weight:500;font-size:15px;
			text-decoration:none;transition:background .15s,border-color .15s;}
		a.primary{background:var(--teal);color:#fff;}
		a.primary:hover{background:#0a9b92;}
		a.ghost{border:1px solid var(--line);color:var(--ink);}
		a.ghost:hover{border-color:var(--teal);color:var(--teal);}
	</style>
</head>
<body>
	<div class="card">
		<img class="mark" src="/images/decoy/mark.png" alt="Decoy">
		<div class="code">4<span>0</span>4</div>
		<h1>This page slipped the net</h1>
		<p>The page you asked for is not here. It may have moved, or the link was wrong.</p>
		<div class="actions">
			<a class="btn primary" href="/">Back to home</a>
			<a class="btn ghost" href="/features">See what Decoy does</a>
		</div>
	</div>
</body>
</html>
